<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>daisy-convertor — the story player</title>
    <meta
      name="description"
      content="Listen to a Telmi, Lunii or Commercial PK story written by daisy-convertor, on the machine's own buttons, in your browser."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1><img src="./icon.svg" alt="" class="mark" />daisy-convertor</h1>
        <p class="tagline" data-i18n="emu_tagline"></p>
        <label class="lang">
          <span data-i18n="language"></span>
          <select id="lang"></select>
        </label>
        <a class="back" href="./index.html" data-i18n="emu_quit"></a>
      </header>

      <section class="card">
        <div id="drop" class="drop" tabindex="0">
          <p><strong data-i18n="emu_drop_title"></strong></p>
          <p class="muted" data-i18n="emu_drop_hint"></p>
          <div class="pickers">
            <label class="button">
              <span data-i18n="emu_pick"></span>
              <input id="picker" type="file" accept=".zip,.pk" />
            </label>
          </div>
        </div>
        <p id="error" class="error" hidden></p>

        <!-- The machine, drawn after the icon: the screen on the left, the speaker's
             grill on its right, and along the bottom the two chapter keys, Back,
             Play/pause and OK. The keys are the story's own: a stage switches them on
             or off, and a dimmed one does nothing. -->
        <div id="player" class="machine" hidden>
          <p id="story-title" class="story-title"></p>
          <div class="shell">
            <div class="screen">
              <canvas id="screen" width="320" height="240"></canvas>
            </div>
            <div class="grill" aria-hidden="true"></div>
            <div class="keys">
              <div class="pair">
                <button id="up" class="key" type="button" data-i18n-aria="emu_chapters">
                  <span class="dial">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 16h18z" /></svg>
                  </span>
                </button>
                <button id="down" class="key" type="button" data-i18n-aria="emu_chapters">
                  <span class="dial">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 3 8h18z" /></svg>
                  </span>
                </button>
                <p class="key-caption" data-i18n="emu_chapters"></p>
              </div>
              <button id="ok" class="key" type="button">
                <span class="dial">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M5 12.5l4.5 4.5L19 7"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="3"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span class="key-name" data-i18n="emu_ok"></span>
              </button>
              <button id="pause" class="key" type="button">
                <span class="dial">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14l10-7zM16 5h2.5v14H16zM20.5 5H23v14h-2.5z" /></svg>
                </span>
                <span class="key-name" data-i18n="emu_play"></span>
              </button>
              <button id="home" class="key" type="button">
                <span class="dial">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M17 5v8a5 5 0 0 1-10 0v-2"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="3"
                      stroke-linecap="round"
                    />
                    <path d="M2.5 12.5 7 18.5 11.5 12.5z" />
                  </svg>
                </span>
                <span class="key-name" data-i18n="emu_back"></span>
              </button>
            </div>
          </div>
          <p class="muted" data-i18n="emu_hint"></p>
          <p class="muted" data-i18n="emu_dimmed"></p>
        </div>
      </section>

      <footer>
        <p data-i18n-html="footer_line"></p>
      </footer>
    </main>

    <script type="module" src="./emulator-app.js"></script>
  </body>
</html>
