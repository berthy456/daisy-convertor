<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>daisy-convertor — DAISY to Telmi, Lunii or Flam story converter</title>
    <meta
      name="description"
      content="Convert a DAISY 2.02, DAISY 3 or EPUB audiobook pack into a Telmi, Lunii or Flam story, entirely in your browser."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>
          <img src="./icon.svg" alt="" class="mark" />daisy-convertor
          <span class="version">1.6</span>
        </h1>
        <p class="tagline" data-i18n="tagline"></p>
        <label class="lang">
          <span data-i18n="language"></span>
          <select id="lang"></select>
        </label>
      </header>

      <section class="card">
        <div id="drop" class="drop" tabindex="0">
          <p><strong data-i18n="drop_title"></strong></p>
          <p class="muted" data-i18n="drop_hint"></p>
          <div class="pickers">
            <label class="button">
              <span data-i18n="pick_zip"></span>
              <input id="picker" type="file" accept=".zip,.epub" />
            </label>
            <label class="button">
              <span data-i18n="pick_folder"></span>
              <input id="folder-picker" type="file" webkitdirectory directory multiple />
            </label>
          </div>
        </div>
        <p id="pack-name" class="pack-name" hidden></p>

        <!-- The player comes first: its screen decides the size every picture is drawn at. -->
        <div class="format-row">
          <span class="muted" data-i18n="format_label"></span>
          <label>
            <input type="radio" name="format" value="telmi" checked />
            <span data-i18n="fmt_telmi"></span>
          </label>
          <label>
            <input type="radio" name="format" value="lunii" />
            <span data-i18n="fmt_lunii"></span>
          </label>
          <label>
            <input type="radio" name="format" value="lunii-pk" />
            <span data-i18n="fmt_lunii_pk"></span>
          </label>
          <label>
            <input type="radio" name="format" value="flam" />
            <span data-i18n="fmt_flam"></span>
          </label>
          <label>
            <input type="radio" name="format" value="merlin" />
            <span data-i18n="fmt_merlin"></span>
          </label>
          <label>
            <input type="radio" name="format" value="mp3" />
            <span data-i18n="fmt_mp3"></span>
          </label>
        </div>

        <div id="cover-section" class="cover">
          <div class="cover-head">
            <h2 data-i18n="cover_title"></h2>
          </div>
          <p class="muted" data-i18n="cover_hint"></p>
          <div class="cover-row">
            <label class="button">
              <span data-i18n="cover_pick"></span>
              <input id="cover-picker" type="file" accept="image/*" />
            </label>
            <!-- One box for a link: what is typed in it is fetched as it is left,
                 the same way the desktop window reads its Image box. -->
            <input id="cover-url" type="url" data-i18n-placeholder="cover_url" />
            <button id="cover-clear" type="button" hidden data-i18n="cover_clear"></button>
            <!-- The lookup asks four services in turn, so it can take a second or
                 two. The log says what it found; this says it is still working and
                 gives the way to call it off. -->
            <span id="cover-spinner" class="spinner" aria-hidden="true" hidden></span>
            <span id="cover-searching" class="muted" data-i18n="cover_searching" hidden></span>
            <button id="cover-stop" type="button" data-i18n="cover_stop" hidden></button>
          </div>
          <!-- None of the four services had the book: the two words typed here are
               the search - asked of the same catalogues the pack's own metadata is
               asked of, and of either engine that answers without an account. -->
          <div class="cover-row cover-search">
            <button id="cover-search-app" type="button" data-i18n="cover_search_app" hidden></button>
            <label>
              <span data-i18n="cover_author"></span>
              <input id="cover-author" type="text" />
            </label>
            <label>
              <span data-i18n="cover_book_title"></span>
              <input id="cover-title" type="text" />
            </label>
            <span class="muted" data-i18n="cover_search_on"></span>
            <a id="cover-search-ddg" class="quiet" target="_blank" rel="noopener" data-i18n="cover_search_ddg" hidden></a>
            <a id="cover-search-google" class="quiet" target="_blank" rel="noopener" data-i18n="cover_search_google" hidden></a>
          </div>
          <!-- The frame the chosen player shows, drawn from the cover: drag it to move,
               zoom it to enlarge. What is on screen here is what the story will carry.
               It is drawn before a cover exists: its shape is what a cover is fitted to. -->
          <div id="crop-box" class="crop-box">
            <canvas id="crop-canvas" tabindex="0"></canvas>
            <p class="muted crop-note" data-i18n="crop_hint"></p>
            <div class="crop-tools">
              <span class="muted" data-i18n="cover_crop_label"></span>
              <label class="crop">
                <input type="radio" name="crop" value="top" /><span data-i18n="crop_top"></span>
              </label>
              <label class="crop">
                <input type="radio" name="crop" value="center" /><span data-i18n="crop_center"></span>
              </label>
              <label class="crop">
                <input type="radio" name="crop" value="bottom" /><span data-i18n="crop_bottom"></span>
              </label>
              <label class="crop-zoom">
                <span data-i18n="crop_zoom"></span>
                <input id="crop-zoom" type="range" min="0" max="4" step="0.05" value="1" />
              </label>
              <label class="crop-zoom">
                <span data-i18n="contrast"></span>
                <input id="crop-contrast" type="range" min="0.5" max="1.5" step="0.05" value="1" />
              </label>
              <button id="crop-reset" type="button" data-i18n="crop_reset"></button>
              <!-- Only the plain Lunii screen is black and white, so only its cards can
                   be read the other way round. -->
              <label id="card-negative-row" class="crop" hidden>
                <input id="card-negative" type="checkbox" />
                <span data-i18n="card_negative"></span>
              </label>
              <p id="negative-note" class="captions-note" data-i18n="card_negative_hint" hidden></p>
              <!-- Only a Telmi or a Flam screen is big enough to read a sentence on,
                   and only a book cut at sentences gives one sentence per part. -->
              <label id="captions-row" class="crop" hidden>
                <input id="captions" type="checkbox" disabled />
                <span data-i18n="captions"></span>
              </label>
              <p id="captions-note" class="captions-note" data-i18n="captions_note" hidden></p>
            </div>
          </div>
        </div>

        <div class="cut">
          <h2 data-i18n="cut_title"></h2>
          <p class="muted" data-i18n="cut_hint"></p>
          <!-- Shut until the pack has been read: which levels it can cut at comes from its own outline. -->
          <div class="cut-row">
            <label>
              <input id="cut-chapter" type="radio" name="cut" value="chapter" checked disabled />
              <span data-i18n="cut_chapter"></span>
            </label>
            <label>
              <input id="cut-paragraph" type="radio" name="cut" value="paragraph" disabled />
              <span data-i18n="cut_paragraph"></span>
            </label>
            <label>
              <input id="cut-sentence" type="radio" name="cut" value="sentence" disabled />
              <span data-i18n="cut_sentence"></span>
            </label>
          </div>
        </div>

        <!-- What the card between two parts shows and says. The words are the
             page's own; the sound is one of the clips under voices/ or the part's
             own opening, so the two are asked for separately. -->
        <div class="cards">
          <h2 data-i18n="cards_title"></h2>
          <div class="cards-row">
            <label class="cards-language">
              <span data-i18n="card_language"></span>
              <select id="card-language"></select>
            </label>
          </div>
          <!-- One line for what a card carries, one for what it says: the same fields
               asked for twice, once as words on the picture and once as sound. -->
          <div class="cards-row">
            <span class="cards-line" data-i18n="cards_text_line"></span>
            <label>
              <span data-i18n="card_field_title"></span>
              <select id="card-text-title"></select>
            </label>
            <label>
              <span data-i18n="card_field_chapter"></span>
              <select id="card-text-chapter"></select>
            </label>
            <label>
              <span data-i18n="card_field_number"></span>
              <select id="card-text-number"></select>
            </label>
            <label>
              <span data-i18n="card_field_total"></span>
              <select id="card-text-total"></select>
            </label>
          </div>
          <div class="cards-row">
            <span class="cards-line" data-i18n="cards_say_line"></span>
            <label>
              <span data-i18n="card_field_chapter"></span>
              <select id="card-say-word"></select>
            </label>
            <label>
              <span data-i18n="card_field_total"></span>
              <select id="card-say-count"></select>
            </label>
            <label class="cards-audio">
              <span data-i18n="card_audio"></span>
              <select id="card-audio">
                <option value="voice" data-i18n="card_audio_voice"></option>
                <option value="snippet" data-i18n="card_audio_snippet"></option>
                <option value="off" data-i18n="card_audio_off"></option>
              </select>
            </label>
          </div>
          <div class="cards-row">
            <label class="cards-seconds">
              <span data-i18n="card_extract_first"></span>
              <input id="card-seconds" type="number" min="0.5" max="30" step="0.5" value="3" />
              <span data-i18n="card_extract_seconds"></span>
            </label>
          </div>
        </div>

        <!-- The parts the pack was cut into, so unwanted ones can be left out.
             The numbers mean the parts of the chosen level, so the list is drawn
             again whenever that level changes. -->
        <div id="parts" class="parts" hidden>
          <div class="parts-head">
            <h2 data-i18n="parts_title"></h2>
            <button id="parts-all" type="button" class="quiet" hidden data-i18n="parts_all"></button>
          </div>
          <p class="muted" data-i18n="parts_hint"></p>
          <p id="parts-note" class="muted"></p>
          <div id="parts-list" class="parts-list"></div>
        </div>

        <div id="summary" class="summary" hidden></div>

        <div class="actions">
          <button id="save" class="primary" type="button" disabled data-i18n="save"></button>
          <button id="test" type="button" disabled data-i18n="test_story"></button>
          <a id="download" class="button primary" hidden download data-i18n="download"></a>
        </div>

        <progress id="bar" max="1" value="0" hidden></progress>
        <pre id="log" aria-live="polite"></pre>
      </section>

      <section class="card">
        <h2 data-i18n="what_title"></h2>
        <p data-i18n="what_p1"></p>
        <p data-i18n-html="what_p2"></p>
      </section>

      <section class="card">
        <h2 data-i18n="before_title"></h2>
        <ul>
          <li data-i18n="before_1"></li>
          <li data-i18n="before_2"></li>
          <li data-i18n="before_3"></li>
          <li data-i18n="before_4"></li>
        </ul>
      </section>

      <section class="card">
        <h2 data-i18n="desktop_title"></h2>
        <p data-i18n="desktop_p1"></p>
        <p data-i18n-html="desktop_line"></p>
      </section>

      <footer>
        <p data-i18n-html="footer_line"></p>
      </footer>

      <!-- The story the page just built, played over the converter itself. The pack
           stays in this page, and closing the player leaves the converter as it was. -->
      <dialog id="test-player" data-i18n-aria="test_story">
        <iframe id="test-frame" data-i18n-aria="test_story"></iframe>
      </dialog>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
