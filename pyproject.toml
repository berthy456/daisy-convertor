[project]
name = "daisy-convertor"
version = "1.3"
description = "Convert a DAISY 2.02, DAISY 3, text-only DAISY or EPUB book into a Telmi, Lunii, Flam or Merlin story"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4"]
dev = ["pytest>=8", "pyinstaller>=6", "tkinterdnd2>=0.4"]

[project.scripts]
daisy-convertor = "daisy2telmi.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The window draws this; PyInstaller unpacks the same file next to the module.
daisy2telmi = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
