<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>daisy-convertor — the story player</title>
    <meta
      name="description"
      content="Listen to a Telmi, Lunii or Commercial PK story written by daisy-convertor, on the machine's own buttons, in your browser."
    />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1><img src="./icon.svg" alt="" class="mark" />daisy-convertor</h1>
        <p class="tagline" data-i18n="emu_tagline"></p>
        <label class="lang">
          <span data-i18n="language"></span>
          <select id="lang"></select>
        </label>
        <a class="back" href="./index.html" data-i18n="emu_back"></a>
      </header>

      <section class="card">
        <div id="drop" class="drop" tabindex="0">
          <p><strong data-i18n="emu_drop_title"></strong></p>
          <p class="muted" data-i18n="emu_drop_hint"></p>
          <div class="pickers">
            <label class="button">
              <span data-i18n="emu_pick"></span>
              <input id="picker" type="file" accept=".zip,.pk" />
            </label>
          </div>
        </div>
        <p id="error" class="error" hidden></p>

        <!-- The machine, drawn after the icon: the screen on the left, the wheel's
             ring on its right, and along the bottom the two arrows, the play
             triangle, the pause bars and the card slot. The keys are the story's
             own: a stage switches them on or off, and a dimmed one does nothing. -->
        <div id="player" class="machine" hidden>
          <p id="story-title" class="story-title"></p>
          <div class="shell">
            <div class="screen">
              <canvas id="screen" width="320" height="240"></canvas>
            </div>
            <div class="ring" aria-hidden="true"></div>
            <div class="keys">
              <div class="pair">
                <button id="up" class="key" type="button" data-i18n-aria="emu_wheel">
                  <span class="dial">
                    <svg class="wheel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 3 16h18z" /></svg>
                    <svg class="seek-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 4 12l7 6zM20 6l-7 6 7 6z" /></svg>
                  </span>
                </button>
                <button id="down" class="key" type="button" data-i18n-aria="emu_wheel">
                  <span class="dial">
                    <svg class="wheel-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 3 8h18z" /></svg>
                    <svg class="seek-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z" /></svg>
                  </span>
                </button>
                <p class="key-caption">
                  <span class="wheel-text" data-i18n="emu_wheel"></span>
                  <span class="seek-text" data-i18n="emu_seek"></span>
                </p>
              </div>
              <button id="ok" class="key" type="button">
                <span class="dial">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" /></svg>
                </span>
                <span class="key-name" data-i18n="emu_ok"></span>
              </button>
              <button id="pause" class="key" type="button">
                <span class="dial">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h4v16H7zM14 4h4v16h-4z" /></svg>
                </span>
                <span class="key-name" data-i18n="emu_pause"></span>
              </button>
              <button id="home" class="key" type="button">
                <span class="dial slot">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18v6H3z" /></svg>
                </span>
                <span class="key-name" data-i18n="emu_home"></span>
              </button>
            </div>
          </div>
          <p class="muted" data-i18n="emu_dimmed"></p>
        </div>
      </section>

      <footer>
        <p data-i18n-html="footer_line"></p>
      </footer>
    </main>

    <script type="module" src="./emulator-app.js"></script>
  </body>
</html>
