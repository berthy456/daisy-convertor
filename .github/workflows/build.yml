name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng espeak-ng-data
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  # PyInstaller cannot cross-compile, so each binary is built on its own OS.
  # choco does not refresh PATH for later steps, so the Windows job installs
  # ffmpeg and builds in one step and hands build_binary.py the resolved path.
  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build daisy-convertor.exe
        run: |
          choco install ffmpeg -y
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ff) {
            $ff = (Get-ChildItem C:\tools, C:\ProgramData\chocolatey -Recurse -Filter ffmpeg.exe `
                    -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $ff) { Write-Error "ffmpeg install produced no ffmpeg.exe"; exit 1 }
          $env:DAISY2TELMI_FFMPEG = $ff
          python build_binary.py
          exit $LASTEXITCODE
      - name: Smoke test the exe
        run: |
          $exe = (Get-ChildItem dist\daisy-convertor-*-windows-*.exe).FullName
          & $exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: daisy-convertor-windows
          path: dist/*.exe

  # Pinned: the bundled libraries inherit the runner's glibc, and 22.04 is the
  # oldest Ubuntu image still published (glibc 2.35).
  linux-deb:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng espeak-ng-data
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build daisy-convertor
        run: python build_binary.py
      - name: Smoke test the binary
        run: dist/daisy-convertor --version
      # The Tcl/Tk and espeak libraries are copied into the binary, so they carry
      # the build machine's glibc. ubuntu-latest (26.04) produced binaries that
      # died on `GLIBC_2.42 not found` on the user's machine; the floor is now
      # checked instead of assumed.
      - name: Check the glibc floor of the bundled libraries
        run: python tools/check_glibc.py --build build --floor 2.35
      # The espeak-ng package is removed again so the run has to use the copy
      # inside the binary: an installed engine would hide a broken bundle.
      - name: Smoke test the spoken cards
        run: |
          sudo apt-get remove -y espeak-ng
          dist/daisy-convertor gon-ruby-mp3.zip /tmp/smoke --announce prompt --language fr
          count=$(ls /tmp/smoke/*/audios/c*.mp3 | wc -l)
          [ "$count" -eq 6 ] || { echo "expected 6 spoken cards, found $count"; exit 1; }
      - name: Package the .deb
        run: |
          arch=$(dpkg --print-architecture)
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version="0.0.0~dev.${GITHUB_SHA::7}"
          python tools/make_deb.py dist/daisy-convertor "dist/daisy-convertor_${version}_${arch}.deb" \
            --version "$version" --architecture "$arch"
      - uses: actions/upload-artifact@v4
        with:
          name: daisy-convertor-linux
          path: dist/*.deb

  # The same binary, packaged the way Arch/Fedora/SUSE users can install it.
  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng espeak-ng-data squashfs-tools
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build daisy-convertor
        run: python build_binary.py
      - name: Smoke test the binary
        run: dist/daisy-convertor --version
      # The Tcl/Tk and espeak libraries are copied into the binary, so they carry
      # the build machine's glibc. ubuntu-latest (26.04) produced binaries that
      # died on `GLIBC_2.42 not found` on the user's machine; the floor is now
      # checked instead of assumed.
      - name: Check the glibc floor of the bundled libraries
        run: python tools/check_glibc.py --build build --floor 2.35
      # Runners have no FUSE, so appimagetool is unpacked instead of mounted.
      - name: Build the AppImage
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version="0.0.0-dev-${GITHUB_SHA::7}"
          curl -fL -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          python tools/make_appimage.py dist/daisy-convertor \
            "dist/daisy-convertor-${version}-x86_64.AppImage" \
            --appimagetool squashfs-root/AppRun
      # The binary was smoke tested before packaging; this asks the packaged file the
      # same question, unpacked because runners have no FUSE. A binary that starts on
      # its own and not inside the AppImage is the bug this catches.
      - name: Smoke test the AppImage
        run: |
          appimage=$(echo "$PWD"/dist/daisy-convertor-*-x86_64.AppImage)
          mkdir -p /tmp/appimage-check && cd /tmp/appimage-check
          "$appimage" --appimage-extract
          ./squashfs-root/AppRun --version
          # The desktop reads the icon from usr/share, not from the AppDir root:
          # an AppImage that carries neither shows up with no picture.
          for one in .DirIcon usr/share/applications/daisy-convertor.desktop \
                     usr/share/icons/hicolor/128x128/apps/daisy-convertor.png \
                     usr/share/icons/hicolor/16x16/apps/daisy-convertor.png; do
            test -f "squashfs-root/$one" || { echo "the AppImage carries no $one"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: daisy-convertor-appimage
          path: dist/*.AppImage

  # PyInstaller builds for the machine it runs on, so the Intel build needs an
  # Intel runner: macos-latest is arm64 only.
  macos-dmg:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          brew install ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build daisy-convertor
        run: python build_binary.py
      - name: Smoke test the binary
        run: dist/daisy-convertor --version
      # Unsigned: Gatekeeper blocks the first run, so the dmg carries the
      # right-click > Open instruction next to the binary.
      - name: Package the .dmg
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$version" = "$GITHUB_REF_NAME" ] && version="0.0.0-dev-${GITHUB_SHA::7}"
          arch=$(uname -m)
          image="dist/daisy-convertor-${version}-macos-${arch}.dmg"
          staging=$(mktemp -d)
          cp dist/daisy-convertor "$staging/"
          cat > "$staging/README.txt" <<'TXT'
          daisy-convertor is not signed or notarised, so macOS blocks it the first time.

          Open it with right-click > Open, or clear the quarantine flag:
              xattr -d com.apple.quarantine daisy-convertor

          Then run:
              ./daisy-convertor <daisy-pack.zip> <output-folder>
          TXT
          hdiutil create -volname daisy-convertor -srcfolder "$staging" -ov -format UDZO "$image"
      - uses: actions/upload-artifact@v4
        with:
          name: daisy-convertor-macos-${{ matrix.arch }}
          path: dist/*.dmg

  # The browser converter: tested under Node, then published as static files.
  web:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the browser modules
        run: node --test tests/web/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, linux-deb, appimage, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tag's own message is the release notes. checkout fetches the annotated
      # tag and then re-points refs/tags/<name> at the commit it peels to, which
      # leaves a lightweight tag: reading it back needs the tag object fetched again.
      - name: Read the annotated tag's message
        id: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Only the Merlin card is beta, and the card's own note says so; the
      # release itself is not a preview.
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: artifacts/*/*
          body_path: notes.md
